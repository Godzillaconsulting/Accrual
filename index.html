<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accrual - Tu aliado en el mundo fiscal y contable</title>
  <link rel="icon" type="image/png" href="/favicon-hd.png?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', 'TU_PIXEL_ID');
  fbq('track', 'PageView');
  </script>
  <!-- End Meta Pixel Code -->

  <!-- Accrual Analytics Tracker -->
  <script>
    window.trackAccrualEvent = function(eventName, metadata = {}) {
        try {
            // 1. Enviar a Meta Pixel si existe
            if (window.fbq) {
                if(eventName === 'page_view') window.fbq('track', 'PageView');
                else if(eventName === 'lead') window.fbq('track', 'Lead', metadata);
                else window.fbq('trackCustom', eventName, metadata);
            }
            
            // 2. Enviar a DB Local Accrual (Dashboard)
            fetch('/api/public/pixel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    event_name: eventName, 
                    source_url: window.location.href, 
                    metadata 
                })
            }).catch(e => console.log('Tracker API silencioso'));
        } catch(e) { console.error('Tracker error'); }
    };

    // Auto-track page view on load
    window.addEventListener('load', () => {
        window.trackAccrualEvent('page_view');
        
        // Track time spent (after 30 seconds)
        setTimeout(() => {
            window.trackAccrualEvent('engaged_session', { duration: '30s' });
        }, 30000);
    });
  </script>
</head>
