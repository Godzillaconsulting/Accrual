version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: accrual-db
    environment:
      - POSTGRES_DB=accrual
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=godzilla2026
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./database/schema_accrual_v1.sql:/docker-entrypoint-initdb.d/schema_accrual_v1.sql
    ports:
      - "5434:5432"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  accrual-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accrual-api
    mem_limit: 384m
    mem_reservation: 192m
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./media-uploads:/app/media-uploads
    restart: unless-stopped
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  accrual-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: accrual-bot
    mem_limit: 384m
    mem_reservation: 192m
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./bot_sessions:/app/bot_sessions
      - ./media-uploads:/app/media-uploads
      - ./qr_accrual.png:/app/qr_accrual.png
    restart: unless-stopped
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  accrual-cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: accrual-cloudflare-tunnel
    network_mode: "host"
    command: tunnel run --token eyJhIjoiODk5YmJiOGZhYjBhZGMwYThlNzlkM2Q4NjhhZmU4NmEiLCJ0IjoiOThlYzJmMTAtM2M4NS00N2NiLWI2ZDMtZjlmNmExZTc4ODk0IiwicyI6Ill6Rm1OR1ZqWkdJdFpHSTBPUzAwT0dZNExXRmlOVFV0TXpJek16QTRPV1l3TTJFdyJ9
    restart: unless-stopped
